name: Public sample checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install the public sample dependency
        run: python -m pip install -r examples/requirements.txt
      - name: Test the public sample
        working-directory: examples
        run: python -m unittest -v test_image_similarity
      - name: Run the synthetic demo
        working-directory: examples
        run: python demo.py
      - name: Regenerate the visual example
        working-directory: examples
        run: python render_demo.py
      - name: Check committed score reproducibility
        run: git diff --exit-code -- assets/image-similarity-demo.json
